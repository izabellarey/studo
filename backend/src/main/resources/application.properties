# Konfiguration der Anwendung.
# Ablage: backend/src/main/resources/application.properties

spring.application.name=stundenplanung

# --- H2-Datenbank ---------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/stundenplanung
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Security ---------------------------------------------------------
app.security.jwt-secret=${JWT_SECRET:nur-fuer-lokale-entwicklung-nicht-fuer-produktion-verwenden-123}
# der Wert ist mittlerweile via docker-compose gesetzt und hier nur der Fallback vermerkt
cors.allowed-origins=${CORS_ALLOWED_ORIGINS} 

# --- JPA ------------------------------------------------------------------
# Das Schema wird aus den annotierten Modellklassen abgeleitet.
#   update      = Schema wird bei Aenderungen angepasst, Daten bleiben
#   create-drop = Schema wird bei jedem Start neu erzeugt
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql wird bei ddl-auto=update sonst NICHT automatisch ausgefÃ¼hrt
# "always" erzwingt die AusfÃ¼hrung bei jedem Start.
# spring.sql.init.mode=always

# Sorgt dafÃ¼r, dass data.sql ERST nach der Hibernate-Schemaerstellung
# lÃ¤uft, nicht davor (sonst "Table not found").
# spring.jpa.defer-datasource-initialization=true



# --- Actuator / Healthcheck ------------------------------------------------
# Wird vom Healthcheck in docker-compose.yml abgefragt (/actuator/health).
management.endpoints.web.exposure.include=health

# --- Deploymentabhaengige Werte ------------------------------------------
# Werden von docker-compose.yml aus .env gesetzt.
app.externe-basis-url=${APP_EXTERNE_BASIS_URL}
app.standard-api-url=${APP_STANDARD_API_URL}

# --- Solver -------------------------------------------------------------
timefold.solver.termination.unimproved-spent-limit=60s
timefold.solver.termination.spent-limit=900s
timefold.solver.environment-mode=PHASE_ASSERT

# --- Beispieldaten --------------------------------------------------------
app.seed-aktiv=true
app.seed-schule=normal
app.seed-verfuegbarkeit=gut